<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>技能五子棋 - 情侣乱斗版</title>
  <!-- Google Fonts Outfit & Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
</head>
<body>

  <!-- Background neon grids -->
  <div class="glow-bg"></div>

  <!-- Login/Room setup Screen -->
  <div id="login-screen" class="glass-panel">
    <div class="title-container">
      <h1>🔮 技能五子棋</h1>
      <p class="subtitle">情侣异地乱斗特别版</p>
    </div>
    <div class="form-group">
      <label for="room-id">房间号</label>
      <input type="text" id="room-id" placeholder="输入房间名/房间号" value="love520">
    </div>
    <div class="form-group">
      <label for="player-name">昵称</label>
      <input type="text" id="player-name" placeholder="输入你的名字">
    </div>
    <button id="join-btn" class="glow-btn">进入房间</button>
  </div>

  <!-- Main Game Screen (Hidden initially) -->
  <div id="game-screen" class="hidden">
    <!-- Header status bar -->
    <header class="game-header">
      <div class="room-info">
        <span class="room-badge">房间: <strong id="display-room-id"></strong></span>
        <span id="role-badge" class="role-badge">旁观中</span>
      </div>
      <div id="turn-banner" class="turn-banner">等待玩家准备...</div>
      <button id="ready-btn" class="ready-btn glow-btn-green hidden">开始对局</button>
    </header>

    <div class="main-layout">
      <!-- Left: Players Stats and Board -->
      <div class="game-area">
        <!-- Players Info Panels -->
        <div class="players-row">
          <!-- Player 1 (Black) -->
          <div id="p1-panel" class="player-card black-player">
            <div class="player-avatar">♟️</div>
            <div class="player-details">
              <span class="player-name" id="p1-name">等待加入...</span>
              <div class="energy-bar-container">
                <div class="energy-bar" id="p1-energy-bar" style="width: 0%"></div>
                <span class="energy-text" id="p1-energy-text">0 / 100 EP</span>
              </div>
            </div>
          </div>

          <div class="vs-text">VS</div>

          <!-- Player 2 (White) -->
          <div id="p2-panel" class="player-card white-player">
            <div class="player-avatar">🤍</div>
            <div class="player-details">
              <span class="player-name" id="p2-name">等待加入...</span>
              <div class="energy-bar-container">
                <div class="energy-bar" id="p2-energy-bar" style="width: 0%"></div>
                <span class="energy-text" id="p2-energy-text">0 / 100 EP</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Board Wrapper -->
        <div class="board-container">
          <div id="skill-tip" class="skill-tip hidden">请在棋盘上选择技能目标...</div>
          <div id="board" class="board">
            <!-- 15x15 Grid Intersections will be dynamically generated by JS -->
          </div>
        </div>
      </div>

      <!-- Right: Skills Panel & Chat -->
      <div class="control-panel">
        <!-- Skills Section -->
        <div class="skills-section glass-panel">
          <h3>🔮 技能仓库</h3>
          <div class="skills-grid">
            <div class="skill-card" data-skill="COQUETRY">
              <div class="skill-icon">💖</div>
              <div class="skill-info">
                <span class="skill-name">撒娇 (悔棋)</span>
                <span class="skill-cost">30 EP</span>
              </div>
            </div>
            <div class="skill-card" data-skill="SCATTER">
              <div class="skill-icon">🌪️</div>
              <div class="skill-info">
                <span class="skill-name">飞沙走石</span>
                <span class="skill-cost">40 EP</span>
              </div>
            </div>
            <div class="skill-card" data-skill="SILENCE">
              <div class="skill-icon">🤫</div>
              <div class="skill-info">
                <span class="skill-name">静如止水</span>
                <span class="skill-cost">35 EP</span>
              </div>
            </div>
            <div class="skill-card" data-skill="CONVERT">
              <div class="skill-icon">💘</div>
              <div class="skill-info">
                <span class="skill-name">偷心贼</span>
                <span class="skill-cost">60 EP</span>
              </div>
            </div>
            <div class="skill-card" data-skill="SWAP">
              <div class="skill-icon">🔄</div>
              <div class="skill-info">
                <span class="skill-name">斗转星移</span>
                <span class="skill-cost">45 EP</span>
              </div>
            </div>
            <div class="skill-card" data-skill="BARRIER">
              <div class="skill-icon">🧱</div>
              <div class="skill-info">
                <span class="skill-name">画地为牢</span>
                <span class="skill-cost">25 EP</span>
              </div>
            </div>
            <div class="skill-card" data-skill="FOG">
              <div class="skill-icon">🌫️</div>
              <div class="skill-info">
                <span class="skill-name">大雾弥漫</span>
                <span class="skill-cost">30 EP</span>
              </div>
            </div>
            <div class="skill-card" data-skill="DOUBLE">
              <div class="skill-icon">💕</div>
              <div class="skill-info">
                <span class="skill-name">贴贴双弹</span>
                <span class="skill-cost">50 EP</span>
              </div>
            </div>
          </div>
          <div class="action-row">
            <button id="cancel-action-btn" class="cancel-btn hidden">取消技能选择</button>
            <button id="skip-btn" class="skip-btn">跳过回合</button>
          </div>
        </div>

        <!-- Chat Section -->
        <div class="chat-section glass-panel">
          <h3>💬 甜言蜜语</h3>
          <div id="chat-messages" class="chat-messages">
            <!-- Messages go here -->
          </div>
          <div class="chat-input-row">
            <input type="text" id="chat-input" placeholder="输入聊天内容...">
            <button id="send-chat-btn">发送</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Coquetry Full Screen Heart Effect Overlay -->
  <div id="heart-overlay" class="heart-overlay hidden">
    <div class="heart-container"></div>
    <div class="heart-message">
      <span class="heart-avatar">😘</span>
      <span id="coquetry-user">亲爱的</span> 对你使用了 <b>撒娇大法</b>！
    </div>
  </div>

  <!-- Game Win Screen Overlay -->
  <div id="win-overlay" class="win-overlay hidden">
    <div class="win-dialog glass-panel">
      <h2 id="win-title">🏆 胜利者诞生！</h2>
      <p id="win-desc">恭喜你获得了本次乱斗的胜利！</p>
      <button id="rematch-btn" class="glow-btn">再来一局</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
